<article class="col-12 col-md-6 pb-4">
  <div class="card h-100">
    <div class="card-body d-flex flex-column">
      <div class="card-header-custom mb-2">
        <h3 class="card-title">{{ .Title }}</h3>
        <small class="text-muted d-block mt-1">
          {{ .Date.Format "02. January 2006" }}
        </small>
      </div>

      <p class="card-text flex-grow-1">
        {{- if .Params.description }}
          {{- .Params.description }}
        {{- else }}
          {{- $excerpt := .Summary }}
          {{- if gt (len $excerpt) 200 }}
            {{- substr $excerpt 0 200 }}...
          {{- else }}
            {{- $excerpt }}
          {{- end }}
        {{- end }}
      </p>

      <div class="mt-auto">
        <a href="{{ .Permalink }}" class="btn btn-sm btn-primary mt-2">Weitere Informationen</a>
      </div>
    </div>
  </div>
</article>
